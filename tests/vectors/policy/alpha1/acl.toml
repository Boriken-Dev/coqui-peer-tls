action = "permit"
source = "10.9.0.0/16"
destination = "10.6.20.5"
port = "7000-7100"
log = true

[[acl.rule]]
action = "permit"
source = "any"
fingerprint = "sha256:abababababababababababababababababababababababababababababababab"

[[acl.rule]]
action = "deny"
source = "any"
