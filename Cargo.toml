[package]
name = "coqui-peer-tls"
version = "0.0.0-alpha.1"
description = "The TLS method of coqui-peer: mutual-TLS identity with pinned, CA and key-proof trust, policy profiles and encrypted streams"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-tls"
homepage = "https://boriken-dev.github.io/coqui-peer-tls/"
keywords = ["tls", "mtls", "rustls", "peer", "pinning"]
categories = ["cryptography", "network-programming", "authentication"]
exclude = [".*", "*.local.*", "/tools/"]

[package.metadata.docs.rs]
# Every feature but `fips`, which adds no item and whose FIPS module needs Go to build.
features = ["generate", "ca", "tokio", "pin", "serde", "acl", "platform-roots", "fields", "aws-lc"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Generate self-signed identities (rcgen; `time`, which rcgen already uses, for validity dates).
generate = ["dep:rcgen", "dep:time"]
# Trust certificates signed by a CA file and matching subject and SAN globs.
ca = ["fields", "dep:globset"]
# A certificate's identifying fields (`CertificateFields`): names, SANs, serial, validity.
fields = ["dep:x509-parser"]
# Async dial and accept over tokio-rustls.
tokio = ["dep:tokio", "dep:tokio-rustls", "coqui-peer/tokio"]
# PIN pairing: coqui-peer's `pin` (SPAKE2, HKDF, HMAC).
pin = ["coqui-peer/pin"]
# Read and write `Policy` in its versioned text form.
serde = ["dep:serde", "coqui-peer/serde", "coqui-net-acl?/serde"]
# An access control list inside `Policy` (the `coqui-net-acl` crate).
acl = ["dep:coqui-net-acl"]
# Verify servers against the operating system's roots and verifier (`Roots::platform`).
platform-roots = ["dep:rustls-platform-verifier"]
# The aws-lc-rs crypto provider (`Policy::crypto = Crypto::AwsLc`): post-quantum key exchange
# (ML-KEM) and ML-DSA signatures. Builds AWS-LC from C: needs a C compiler (clang on Windows ARM64).
aws-lc = ["rustls/aws_lc_rs", "webpki/aws-lc-rs"]
# AWS-LC's FIPS module (the `fips-140-3-validated` cipher profile). Global: rustls's `fips` changes
# defaults for every crate in the build. Builds aws-lc-fips-sys: needs CMake and Go, and on
# Windows bindgen (libclang), NASM and Ninja.
fips = ["aws-lc", "rustls/fips"]

[dependencies]
# The peer id, trust store, pairing and handshake this crate is the TLS method of. Alpha: the
# family's crates are released together. The version is what a published package resolves;
# the revision is the commit with that version, for building from git.
coqui-peer = { version = "=0.0.0-alpha.1", git = "https://github.com/Boriken-Dev/coqui-peer", rev = "e8b7f30854b1b8fbbf81db9bee92ffad63901990" }
# TLS. Pre-1.0: rustls's current release line; the ring provider is passed explicitly. TLS 1.2
# is rustls's own code (no dependency); a policy chooses whether it is offered.
rustls = { version = "0.23.27", default-features = false, features = ["std", "ring", "tls12"] }
# The signature verification algorithms the cipher profiles name; already a dependency of rustls.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring"] }
# The access control list inside a `Policy`, behind `acl`. Alpha, released with this crate.
coqui-net-acl = { version = "0.0.0-alpha.0", git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "e0f31323bffeb6ff05c2c3e5c50a7d58e6aafd28", optional = true }
# The text form of `Policy`, behind `serde`.
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
# Self-signed identities, behind `generate`. Pre-1.0: rcgen's and time's current release lines.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
time = { version = "0.3.6", default-features = false, optional = true }
# Certificate fields, behind `fields`, and CA name globs, behind `ca`. Pre-1.0: the current
# release lines.
x509-parser = { version = "0.18", default-features = false, optional = true }
globset = { version = "0.4", default-features = false, optional = true }
# Async streams, behind `tokio`. Pre-1.0: tokio-rustls's release line for rustls 0.23.
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
# The operating system's verifier, behind `platform-roots`. Pre-1.0: its current release line.
rustls-platform-verifier = { version = "0.7.1", default-features = false, optional = true }

[dev-dependencies]
# Temporary identity and store directories.
tempfile = "3"
# Certificate chains and CAs in tests.
rcgen = "0.14"
# The policy text form in tests.
serde_json = "1"
toml = "0.9"
# Reads the extensions of generated certificates in tests.
x509-parser = "0.18"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "io-util", "time"] }
# A QUIC host, which takes a server configuration per connection.
quinn = { version = "0.11.9", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
