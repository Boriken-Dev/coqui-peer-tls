[package]
name = "coqui-peer"
version = "0.1.0"
description = "Mutual-TLS peer identity: certificate fingerprints, pinned, CA and key-proof trust, a trust store, policy profiles and encrypted streams"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-tls"
publish = false
exclude = [".*", "*.local.*"]

[package.metadata.docs.rs]
all-features = true

[features]
# TLS 1.2 support in rustls, needed by the `compatible` and `legacy` profiles. It adds only
# code to rustls; without it a policy that asks for TLS 1.2 is a clear error.
default = []
tls12 = ["rustls/tls12", "tokio-rustls?/tls12"]
# Generate self-signed identities (rcgen).
generate = ["dep:rcgen"]
# Trust certificates signed by a CA file and matching subject and SAN globs.
ca = ["dep:x509-parser", "dep:globset"]
# Async dial and accept over tokio-rustls.
tokio = ["dep:tokio", "dep:tokio-rustls"]
# Read and write `Policy` in its versioned text form.
serde = ["dep:serde", "coqui-net-acl?/serde"]
# An access control list inside `Policy` (the `coqui-net-acl` crate).
acl = ["dep:coqui-net-acl"]

[dependencies]
data-encoding = { version = "2", default-features = false, features = ["alloc"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6"
coqui-net-acl = { git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "ef48f2564ab3193d5204f52b8607f25bea1050c5", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
rcgen = { version = "0.14", optional = true }
x509-parser = { version = "0.18", optional = true }
globset = { version = "0.4", optional = true }
tokio = { version = "1", default-features = false, features = ["net"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
serde_json = "1"
toml = "0.9"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "io-util"] }
