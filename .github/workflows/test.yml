name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag, which is
# throwaway and deleted after its run. Not run on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every feature but `fips`, whose FIPS module needs CMake and Go; the fips leg below has them.
  ALL_FEATURES: generate,ca,tokio,pin,serde,acl,platform-roots,fields,aws-lc

jobs:
  # The committed public API, so a change to it is seen in review. Regenerate with:
  # cargo +nightly-2026-09-21 public-api --features <ALL_FEATURES> -sss --color never > tools/public-api.txt
  public-api:
    name: Public API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # cargo-public-api 0.52 reads the rustdoc JSON of this nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
      - name: Install cargo-public-api
        run: cargo +stable install cargo-public-api --version 0.52.0 --locked
      - name: Compare with tools/public-api.txt
        run: |
          cargo +nightly-2026-09-21 public-api --features ${{ env.ALL_FEATURES }} -sss --color never > "$RUNNER_TEMP/public-api.txt"
          diff -u tools/public-api.txt "$RUNNER_TEMP/public-api.txt"

  rust:
    name: Rust (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --all-targets --features ${{ env.ALL_FEATURES }} -- -D warnings
      - run: cargo test --features ${{ env.ALL_FEATURES }}
      - run: cargo doc --no-deps --features ${{ env.ALL_FEATURES }}
        env:
          RUSTDOCFLAGS: -D warnings

  # Each feature set builds, lints and tests on its own, so a feature that only works
  # beside another is caught.
  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "none"
            flags: "--no-default-features"
          - name: "all but fips"
            flags: "--features generate,ca,tokio,pin,serde,acl,platform-roots,fields,aws-lc"
          - name: "aws-lc"
            flags: "--no-default-features --features aws-lc"
          # AWS-LC's FIPS module: CMake and Go, both on ubuntu-latest.
          - name: "fips"
            flags: "--no-default-features --features fips,generate"
          - name: "platform-roots"
            flags: "--no-default-features --features platform-roots"
          - name: "pin"
            flags: "--no-default-features --features pin"
          - name: "acl"
            flags: "--no-default-features --features acl"
          - name: "generate"
            flags: "--no-default-features --features generate"
          - name: "ca"
            flags: "--no-default-features --features ca"
          - name: "fields"
            flags: "--no-default-features --features fields"
          - name: "tokio"
            flags: "--no-default-features --features tokio"
          - name: "serde"
            flags: "--no-default-features --features serde"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # bindgen 0.73 accepts prettyplease 0.3, which is built on another syn and does not compile.
      - name: Pin prettyplease for bindgen
        if: matrix.name == 'fips'
        run: cargo generate-lockfile && cargo update -p prettyplease --precise 0.2.37
      - run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings
      - run: cargo test ${{ matrix.flags }}
